<div style="width: 280px">
    <div mat-dialog-title style="margin-top: 10px">
        <div
            class="logo"
            style="
                display: inline-block;
                width: 48px;
                height: 48px;
                background-color: #fff;
                border-radius: 8px;
            "
        ></div>
        <div
            style="font-size: 18px; display: inline-block; vertical-align: super; padding-left: 5px"
        >
            TSC Expert
        </div>
    </div>
    <div mat-dialog-content style="margin-bottom: 10px">
        <div style="display: block">{{'header.info-version' | translate}} {{data.version}}</div>
        <div style="display: block; font-size: 13px; margin-top: 10px">
            Dikembangkan oleh PT TSC
        </div>
        <div style="display: block; font-size: 12px; margin-top: 10px">
            Berbasis <b>FUXA</b>, perangkat lunak open source oleh frangoteam, berlisensi MIT.<br />
            <a href="https://github.com/frangoteam/FUXA" target="_blank" rel="noopener"
                >github.com/frangoteam/FUXA</a
            >
        </div>
    </div>
    <div mat-dialog-actions class="dialog-action">
        <button mat-raised-button [mat-dialog-close]="data">{{'dlg.ok' | translate}}</button>
    </div>
</div>
